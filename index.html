<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Thanuu 🎂</title>

<style>
body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg,#ffd6e7,#d9f3ff,#fff1b8);
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}

.card {
    width: 85%;
    max-width: 420px;
    padding: 35px 20px;
    text-align: center;
    background: rgba(255,255,255,.85);
    border-radius: 30px;
    box-shadow: 0 15px 40px rgba(0,0,0,.15);
}

h1 {
    color: #ff4f91;
    font-size: 36px;
}

p {
    color: #555;
    font-size: 18px;
    line-height: 1.6;
}

button {
    border: 0;
    padding: 15px 28px;
    border-radius: 30px;
    background: #ff5c9a;
    color: white;
    font-size: 18px;
}

.balloon {
    position: fixed;
    bottom: -100px;
    font-size: 55px;
    animation: float 7s linear infinite;
}

.b1 {left: 10%;}
.b2 {left: 35%;animation-delay:2s;}
.b3 {left: 65%;animation-delay:1s;}
.b4 {left: 85%;animation-delay:3s;}

@keyframes float {
    from {transform:translateY(0);}
    to {transform:translateY(-120vh);}
}

#surprise {
    display:none;
}
</style>
</head>

<body>

<div class="balloon b1">🎈</div>
<div class="balloon b2">🎈</div>
<div class="balloon b3">🎈</div>
<div class="balloon b4">🎈</div>

<div class="card" id="start">
    <div style="font-size:60px;">🎁</div>

    <h1>Hey Thanuu! 💖</h1>

    <p>Neekosam oka small surprise undhi... ✨</p>

    <button onclick="openSurprise()">
        Open Your Surprise 🎁
    </button>
</div>

<div class="card" id="surprise">

    <div style="font-size:65px;">🎂</div>

    <h1>
        HAPPY BIRTHDAY<br>
        THANUUU! 🥳💖
    </h1>

    <p>
        Nee birthday chala special ga undali! ✨<br>
        Nee face lo smile eppudu ilaage undali 😊<br>
        Enjoy your special day! 🎉
    </p>

    <p>
        With lots of wishes 💕<br>
        — <b>Yarab</b>
    </p>

</div>

<script>
function openSurprise() {

    document.getElementById("start").style.display = "none";

    document.getElementById("surprise").style.display = "block";

    for(let i=0;i<35;i++){

        let c = document.createElement("div");

        c.innerHTML = ["🎉","✨","💖","🌸","🎊"]
        [Math.floor(Math.random()*5)];

        c.style.position = "fixed";
        c.style.left = Math.random()*100 + "vw";
        c.style.top = "-20px";
        c.style.fontSize = "25px";
        c.style.animation = "fall 4s linear";

        document.body.appendChild(c);
    }
}
</script>

<style>
@keyframes fall {
    from {transform:translateY(-20px) rotate(0deg);}
    to {transform:translateY(110vh) rotate(360deg);}
}
</style>

</body>
</html>
